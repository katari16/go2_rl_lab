msg_type: "go"
imu_type: "pelvis"

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"

# P17: 6D wrench | h=30 | bigger net enc=[256,128] | torque angle loss | 30N/10Nm
policy_path:    "deploy/pre_train/ablation_p17/policy.pt"
estimator_path: "deploy/pre_train/ablation_p17/estimator.pt"

leg_joint2motor_idx: [3,0,9,6,4,1,10,7,5,2,11,8]
default_angles: [-0.1, 0.8, -1.5, 0.1, 0.8, -1.5, -0.1, 1.0, -1.5, 0.1, 1.0, -1.5]

# Kp=8, Kd=0.4 — matches training (stiffness=8.0, damping=0.4)
kps: [8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0]
kds: [0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4]

weak_motor: []
arm_waist_joint2motor_idx: []
arm_waist_kps: []
arm_waist_kds: []
arm_waist_target: []

control_dt: 0.02
action_scale: 0.5
cmd_scale: [1.0, 1.0, 1.0]
max_cmd: [1.0, 1.0, 1.0]
num_actions: 12

# Obs: 57 raw + 6D wrench (Fx,Fy,Fz,τx,τy,τz) = 63
raw_obs_dim: 57
force_dim: 6
policy_obs_dim: 63
force_layout: auto          # yaw_idx = 5

# Force estimator
estimator_temporal_steps: 30

# Compliance: XY force + τ_yaw (index 5 in 6D layout)
# Y=toggle off/on, X=toggle inverted/normal
compliance_k: 0.04
compliance_k_yaw: 0.02
ema_alpha: 0.1
