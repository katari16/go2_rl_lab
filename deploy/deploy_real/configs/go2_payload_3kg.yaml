msg_type: "go"
imu_type: "pelvis"

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"

# Payload 3kg: 3D (Fx,Fy,Fz) | h=20 | Go2 with 3kg basket payload
policy_path:    "deploy/pre_train/payload_3kg/policy.pt"
estimator_path: "deploy/pre_train/payload_3kg/estimator.pt"

leg_joint2motor_idx: [3,0,9,6,4,1,10,7,5,2,11,8]
default_angles: [-0.1, 0.8, -1.5, 0.1, 0.8, -1.5, -0.1, 1.0, -1.5, 0.1, 1.0, -1.5]

# Kp=8, Kd=0.4 — matches training (stiffness=8.0, damping=0.4)
kps: [8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0]
kds: [0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4]

weak_motor: []
arm_waist_joint2motor_idx: []
arm_waist_kps: []
arm_waist_kds: []
arm_waist_target: []

control_dt: 0.02
action_scale: 0.5
cmd_scale: [1.0, 1.0, 1.0]
max_cmd: [1.0, 1.0, 1.0]
num_actions: 12

# Obs: 57 raw + 3D force (Fx,Fy,Fz) = 60
raw_obs_dim: 57
force_dim: 3
policy_obs_dim: 60
force_layout: auto          # no yaw torque channel

# Force estimator
estimator_temporal_steps: 20

# XY compliance only (no yaw torque channel in 3D)
# Y=toggle off/on, X=toggle inverted/normal
compliance_k: 0.06
compliance_k_yaw: 0.0
ema_alpha: 0.1
