msg_type: "go"
imu_type: "pelvis"

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"

# 6Dctrl-Total50: R1 architecture + commanded roll/pitch/height pose tracking
# Curriculum gate = total reward >= 50 (no est-acc reward)
# Estimator: R1 base (6D, h=30, enc=[256,128], f_head=[64,32], TCN pre, no rec)
policy_path:    "deploy/pre_train/ablation_6dctrl_total50/policy.pt"
estimator_path: "deploy/pre_train/ablation_6dctrl_total50/estimator.pt"

leg_joint2motor_idx: [3,0,9,6,4,1,10,7,5,2,11,8]
default_angles: [-0.1, 0.8, -1.5, 0.1, 0.8, -1.5, -0.1, 1.0, -1.5, 0.1, 1.0, -1.5]

kps: [8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0]
kds: [0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4]

weak_motor: []
arm_waist_joint2motor_idx: []
arm_waist_kps: []
arm_waist_kds: []
arm_waist_target: []

control_dt: 0.02
action_scale: 0.5
# cmd_scale / max_cmd apply to [vx, vy, wz]; pose cmds are handled separately
cmd_scale: [1.0, 1.0, 1.0]
max_cmd: [1.0, 1.0, 1.0]
num_actions: 12

# Obs: 57 base + 3 pose-cmd channels (roll, pitch, height) + 6D wrench = 66
# Raw obs layout (60 dims, fed to estimator):
#   [0:3]   base_ang_vel
#   [3:6]   projected_gravity
#   [6:9]   velocity_cmd (vx, vy, wz)
#   [9:12]  pose_cmd (roll, pitch, height)
#   [12:24] joint_pos_rel
#   [24:36] joint_vel_rel
#   [36:48] last_action
#   [48:60] applied_torque*0.1
raw_obs_dim: 60
force_dim: 6
policy_obs_dim: 66
force_layout: auto          # yaw_idx = 5

estimator_temporal_steps: 30

# Pose-command ranges (clamps applied at deploy time) — match training
pose_cmd_ranges:
  roll:   [-0.35, 0.35]
  pitch:  [-0.35, 0.35]
  height: [0.18, 0.38]
nominal_height: 0.34

# Compliance (disabled by default; match compliant experiments if needed)
compliance_k: 0.0
compliance_k_yaw: 0.0
ema_alpha: 0.1
