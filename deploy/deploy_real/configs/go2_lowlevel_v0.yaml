msg_type: "go"
imu_type: "pelvis"

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"

# Low-level v0: retrained after refactor (sanity check)
policy_path: "deploy/pre_train/lowlevel_v0/policy.pt"
estimator_path: "deploy/pre_train/lowlevel_v0/estimator.pt"

leg_joint2motor_idx: [3,0,9,6,4,1,10,7,5,2,11,8]
default_angles: [-0.1,  0.8, -1.5, 0.1, 0.8, -1.5, -0.1, 1, -1.5, 0.1, 1, -1.5]

# LOW GAINS — must match training (Kp=8, Kd=0.4)
kps: [8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0]
kds: [0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4, 0.4]

weak_motor: []
arm_waist_joint2motor_idx: []
arm_waist_kps: []
arm_waist_kds: []
arm_waist_target: []

control_dt: 0.02
action_scale: 0.5
cmd_scale: [1.0, 1.0, 1.0]
max_cmd: [1.0, 1.0, 1.0]
num_actions: 12
raw_obs_dim: 57          # obs without force estimate
force_dim: 3             # XYZ force estimate from estimator
policy_obs_dim: 60       # raw_obs_dim + force_dim = policy input

# Force estimator config (must match training)
estimator_temporal_steps: 20

# Compliance modulation (v* = v_cmd + k * EMA(F_hat_xy))
compliance_k: 0.06
ema_alpha: 0.1
