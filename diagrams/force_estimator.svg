<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Arial, sans-serif">
  <rect width="900" height="350" fill="white"/>

  <!-- ===== ENCODER (trapezoid) ===== -->
  <polygon points="30,250 30,120 170,140 170,230" fill="none" stroke="black" stroke-width="2"/>
  <text x="90" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="black">Encoder</text>
  <text x="90" y="205" text-anchor="middle" font-size="14" fill="black">[128, 64]</text>

  <!-- Input arrow -->
  <line x1="0" y1="185" x2="30" y2="185" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="black"/>
    </marker>
  </defs>

  <!-- Arrow from encoder output -->
  <line x1="170" y1="185" x2="250" y2="185" stroke="black" stroke-width="2"/>
  <!-- z_t label -->
  <text x="210" y="260" text-anchor="middle" font-size="18" font-weight="bold" font-style="italic" fill="black">z_t</text>

  <!-- Branch up to f_head -->
  <line x1="250" y1="185" x2="250" y2="110" stroke="black" stroke-width="2"/>
  <line x1="250" y1="110" x2="310" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch down to continue to concat -->
  <line x1="250" y1="185" x2="250" y2="270" stroke="black" stroke-width="2"/>
  <line x1="250" y1="270" x2="540" y2="270" stroke="black" stroke-width="2"/>

  <!-- ===== f_head (small block) ===== -->
  <rect x="315" y="85" width="100" height="50" rx="4" fill="none" stroke="black" stroke-width="2"/>
  <text x="365" y="108" text-anchor="middle" font-size="16" font-weight="bold" font-style="italic" fill="black">f_head</text>
  <text x="365" y="126" text-anchor="middle" font-size="12" fill="black">[32, 16]</text>

  <!-- Arrow from f_head to f_hat label -->
  <line x1="415" y1="110" x2="490" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- f_hat label -->
  <text x="460" y="98" text-anchor="middle" font-size="16" font-style="italic" fill="black">f&#x0302;_t</text>

  <!-- ===== Concat bar (l_t) ===== -->
  <rect x="500" y="80" width="20" height="220" rx="2" fill="none" stroke="black" stroke-width="2"/>

  <!-- f_hat arrow into concat top -->
  <line x1="498" y1="110" x2="500" y2="110" stroke="black" stroke-width="2"/>

  <!-- z_t arrow into concat bottom -->
  <line x1="498" y1="270" x2="500" y2="270" stroke="black" stroke-width="2"/>

  <!-- Small labels inside concat -->
  <text x="510" y="105" text-anchor="middle" font-size="9" fill="black">f&#x0302;</text>
  <text x="510" y="230" text-anchor="middle" font-size="9" fill="black">z</text>
  <!-- Divider line in concat bar -->
  <line x1="502" y1="130" x2="518" y2="130" stroke="black" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- l_t label -->
  <text x="555" y="185" text-anchor="middle" font-size="18" font-weight="bold" font-style="italic" fill="black">l_t</text>

  <!-- Arrow from concat to decoder -->
  <line x1="520" y1="190" x2="610" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== DECODER (trapezoid, expanding) ===== -->
  <polygon points="620,230 620,150 790,120 790,260" fill="none" stroke="black" stroke-width="2"/>
  <text x="705" y="185" text-anchor="middle" font-size="20" font-weight="bold" fill="black">Decoder</text>
  <text x="705" y="210" text-anchor="middle" font-size="14" fill="black">[256, 128]</text>

  <!-- Arrow out of decoder -->
  <line x1="790" y1="190" x2="860" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- o_hat label -->
  <text x="840" y="175" text-anchor="middle" font-size="16" font-style="italic" fill="black">o&#x0302;_t+1</text>

  <!-- ===== Dimension annotations ===== -->
  <text x="10" y="170" text-anchor="middle" font-size="11" fill="#555">1140</text>
  <text x="10" y="183" text-anchor="middle" font-size="9" fill="#555">(20×57)</text>
  <text x="870" y="210" text-anchor="middle" font-size="11" fill="#555">57</text>
  <text x="460" y="80" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="555" y="210" text-anchor="middle" font-size="11" fill="#555">67</text>
</svg>